name: Checks
on:
  push:
    branches: [main, development]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan tracked secrets and metadata
        run: python scripts/check_secrets.py
      - name: Test app and firmware character contract
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; Path('/tmp/display-ui.js').write_text(re.search(r'<script>(.*?)</script>',Path('esp32_display/index.html').read_text(),re.S).group(1))"
          node --check /tmp/display-ui.js
